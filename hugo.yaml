baseURL: "https://ramathuzen.github.io/"
locale: "en-us"
title: "Annamalai"
enableRobotsTXT: true

# KaTeX delimiters are parsed by Goldmark. Math is rendered to MathML at
# build time in layouts/_default/_markup/render-passthrough.html, so pages
# ship no math JavaScript or external CSS.
markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ["\\[", "\\]"]
            - ["$$", "$$"]
          inline:
            - ["\\(", "\\)"]
            - ["$", "$"]
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    tabWidth: 4

# JSON powers the lightweight search page.
outputs:
  home:
    - HTML
    - RSS
    - JSON

pagination:
  pagerSize: 10

taxonomies:
  tag: tags

menu:
  main:
    - identifier: blogs
      name: Blogs
      url: /blogs/
      weight: 10
    - identifier: tils
      name: TILs
      url: /tils/
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40

params:
