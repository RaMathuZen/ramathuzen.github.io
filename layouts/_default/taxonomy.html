{{ define "main" }}
  <div class="page-header">
    <h1>#{{ .Data.Term | default .Title }}</h1>
    <p class="description">{{ len .Pages }} post{{ if ne (len .Pages) 1 }}s{{ end }}</p>
  </div>

  {{ partial "post-list.html" (dict "pages" .Pages.ByDate.Reverse "showSection" true) }}

  <p class="back-link"><a href="{{ "tags/" | relURL }}">← All tags</a></p>
{{ end }}
